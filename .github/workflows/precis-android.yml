name: Précis Android

on:
  push:
    paths: ["precis-android/**", ".github/workflows/precis-android.yml"]
  pull_request:
    paths: ["precis-android/**", ".github/workflows/precis-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: precis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); no setup action needed.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core logic, Claude client, player state machine, screens)
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: precis-debug-apk
          path: precis-android/app/build/outputs/apk/debug/app-debug.apk
